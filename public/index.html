<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compartilhar localização</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:50px auto;padding:20px;text-align:center}
button{font-size:18px;padding:14px 20px;border:0;border-radius:10px;cursor:pointer}
#status{margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<h1>Compartilhar localização</h1>
<p>Este site só envia sua localização se você escolher compartilhar e autorizar o navegador.</p>
<button id="share">Compartilhar minha localização</button>
<div id="status"></div>
<script>
const button=document.getElementById("share");
const status=document.getElementById("status");
button.addEventListener("click",()=>{
  if(!navigator.geolocation){status.textContent="Seu navegador não oferece geolocalização.";return;}
  status.textContent="Aguardando sua permissão...";
  navigator.geolocation.getCurrentPosition(async p=>{
    const data={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,timestamp:new Date().toISOString()};
    try{
      const r=await fetch("/api/location",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
      if(!r.ok)throw new Error();
      status.textContent="Localização compartilhada com sucesso.";
    }catch{status.textContent="Não foi possível enviar a localização.";}
  },e=>{
    status.textContent=e.code===1?"Você não autorizou o compartilhamento da localização.":"Não foi possível obter sua localização.";
  });
});
</script>
</body>
</html>
